<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Umbra — atlas des éclipses solaires</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04060C; --panel:#090E19; --panel2:#0D1422; --line:#1A2436; --line2:#243149;
  --txt:#D5DCEA; --dim:#78879F; --dim2:#4E5C74;
  --total:#FFE4A0; --annular:#FF9147; --hybrid:#C98BFF; --partial:#5E86B8;
  --accent:#79CFEE;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:13px;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- frame ---------- */
#app{display:grid;grid-template-columns:340px 1fr;grid-template-rows:1fr auto;height:100%}
#rail{grid-row:1/3;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;position:relative;z-index:5}
#stage{position:relative;overflow:hidden;background:var(--bg)}
#ribbonWrap{border-top:1px solid var(--line);background:var(--panel);position:relative;z-index:4}

/* ---------- header ---------- */
.brand{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.brand h1{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1;margin:0;letter-spacing:.3px}
.brand h1 em{font-style:italic;color:var(--total)}
.brand p{margin:6px 0 0;color:var(--dim);font-size:11.5px;line-height:1.45}

/* ---------- generic blocks ---------- */
.sect{padding:14px 18px;border-bottom:1px solid var(--line)}
.sect.scroll{flex:1;min-height:0;overflow-y:auto;padding:0;border-bottom:none}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim2);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.eyebrow b{color:var(--dim);font-weight:500}

/* ---------- range ---------- */
.yearRow{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.yearBox{background:var(--panel2);border:1px solid var(--line2);border-radius:3px;
  padding:5px 7px;width:74px;font-family:var(--mono);font-size:15px;text-align:center;letter-spacing:.02em}
.yearBox:focus{outline:none;border-color:var(--accent)}
.yearRow span{color:var(--dim2);font-family:var(--mono);font-size:11px}
.yearRow .span{margin-left:auto;color:var(--dim);font-family:var(--mono);font-size:11px}
.slider{position:relative;height:26px;margin:0 9px}
.slider .track{position:absolute;top:11px;left:-9px;right:-9px;height:3px;background:var(--line);border-radius:2px}
.slider .fill{position:absolute;top:11px;height:3px;background:var(--accent);opacity:.55;border-radius:2px}
.slider .knob{position:absolute;top:5px;width:15px;height:15px;margin-left:-7.5px;border-radius:50%;
  background:var(--txt);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--accent);cursor:grab;touch-action:none}
.slider .knob:active{cursor:grabbing}
.slider .knob:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ticks{position:relative;height:12px;margin:0 9px;font-family:var(--mono);font-size:9px;color:var(--dim2);margin-top:-2px}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ticks span:first-child{transform:none}
.ticks span:last-child{transform:translateX(-100%)}
.presets{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.chip{border:1px solid var(--line2);border-radius:11px;padding:3px 9px;font-size:10.5px;color:var(--dim);background:var(--panel2)}
.chip:hover{border-color:var(--accent);color:var(--txt)}

/* ---------- toggles ---------- */
.seg{display:flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.seg button{flex:1;padding:6px 4px;font-size:11.5px;color:var(--dim);background:var(--panel2)}
.seg button[aria-pressed=true]{background:var(--line2);color:var(--txt)}
.filters{display:flex;flex-direction:column;gap:6px}
.filt{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--dim)}
.filt input{appearance:none;width:13px;height:13px;border:1px solid var(--line2);border-radius:2px;
  background:var(--panel2);flex:none;cursor:pointer}
.filt input:checked{background:currentColor;border-color:currentColor}
.filt .sw{width:16px;height:3px;border-radius:2px;flex:none}
.filt b{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--dim2)}
.filt.on{color:var(--txt)}

/* ---------- list ---------- */
.listHead{position:sticky;top:0;background:var(--panel);padding:12px 18px 8px;z-index:2;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:9px;padding:7px 18px;border-bottom:1px solid rgba(26,36,54,.55);cursor:pointer}
.row:hover{background:var(--panel2)}
.row[aria-selected=true]{background:#141F33;box-shadow:inset 2px 0 0 var(--accent)}
.row .dot{width:7px;height:7px;border-radius:50%;flex:none}
.row .dt{font-family:var(--mono);font-size:11.5px;letter-spacing:-.01em}
.row .tp{font-family:var(--mono);font-size:10px;color:var(--dim2);margin-left:auto}
.row .du{font-family:var(--mono);font-size:10.5px;color:var(--dim);width:52px;text-align:right}

/* ---------- detail ---------- */
#detail{padding:0}
.dHead{padding:14px 18px 12px;border-bottom:1px solid var(--line)}
.dHead .kind{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.dHead .date{font-family:var(--serif);font-size:25px;line-height:1.1;margin:3px 0 2px}
.dHead .sub{color:var(--dim);font-size:11.5px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 18px;font-size:11.5px}
.kv dt{color:var(--dim)}
.kv dd{margin:0;font-family:var(--mono);font-size:11.5px;text-align:right}
.note{padding:0 18px 14px;color:var(--dim2);font-size:10.5px;line-height:1.5}

/* ---------- stage overlays ---------- */
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.hud{position:absolute;pointer-events:none;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
#coords{left:12px;bottom:10px;background:rgba(4,6,12,.7);padding:3px 7px;border-radius:3px}
#scaleNote{right:12px;bottom:10px;text-align:right;background:rgba(4,6,12,.7);padding:3px 7px;border-radius:3px}
#viewBtns{position:absolute;top:12px;left:12px;display:flex;gap:6px}
#viewBtns button, .miniBtn{background:rgba(9,14,25,.88);border:1px solid var(--line2);border-radius:3px;
  padding:5px 11px;font-size:11.5px;color:var(--dim);backdrop-filter:blur(6px)}
#viewBtns button[aria-pressed=true]{color:var(--txt);border-color:var(--accent)}
#zoomBtns{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px}
#zoomBtns button{width:30px;height:28px;font-size:14px;line-height:1;background:rgba(9,14,25,.88);
  border:1px solid var(--line2);border-radius:3px;color:var(--dim)}
#zoomBtns button:hover{color:var(--txt);border-color:var(--accent)}
#legend{position:absolute;left:12px;top:52px;background:rgba(9,14,25,.82);border:1px solid var(--line);
  border-radius:4px;padding:9px 11px;font-size:10.5px;color:var(--dim);backdrop-filter:blur(6px)}
#legend div{display:flex;align-items:center;gap:7px;margin:3px 0}
#legend i{width:16px;height:4px;border-radius:2px;display:block}
#tip{position:absolute;pointer-events:none;background:rgba(9,14,25,.95);border:1px solid var(--line2);
  border-radius:4px;padding:6px 9px;font-size:11px;display:none;max-width:230px;line-height:1.45;z-index:9}
#tip .t{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
#hint{position:absolute;left:50%;transform:translateX(-50%);top:12px;background:rgba(9,14,25,.9);
  border:1px solid var(--line2);border-radius:20px;padding:6px 14px;font-size:11.5px;color:var(--dim);
  pointer-events:none;transition:opacity .5s;backdrop-filter:blur(6px);max-width:calc(100% - 240px);text-align:center}
#hint.gone{opacity:0}

/* ---------- player ---------- */
#player{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;display:none;
  align-items:center;gap:10px;background:rgba(9,14,25,.92);border:1px solid var(--line2);
  border-radius:5px;padding:7px 12px;backdrop-filter:blur(8px);max-width:min(560px,calc(100% - 24px));width:max-content}
#player.on{display:flex}
#player .clock{font-family:var(--mono);font-size:12px;min-width:74px}
#player .lab{font-family:var(--mono);font-size:9.5px;color:var(--dim2);letter-spacing:.1em}
#player input[type=range]{width:190px;accent-color:var(--accent);background:transparent}
#play{width:26px;height:26px;border:1px solid var(--line2);border-radius:3px;color:var(--txt);flex:none}

/* ---------- ribbon ---------- */
#ribbon{display:block;width:100%;height:56px;cursor:pointer}
#progress{position:absolute;left:0;top:0;height:2px;background:var(--accent);width:0;transition:width .15s}

/* ---------- probe ---------- */
.probeHead{display:flex;align-items:center;gap:8px;padding:12px 18px 8px}
.probeHead .close{margin-left:auto;color:var(--dim2);font-size:15px;line-height:1}
.pr{padding:6px 18px;border-bottom:1px solid rgba(26,36,54,.55);display:flex;gap:9px;align-items:baseline;cursor:pointer}
.pr:hover{background:var(--panel2)}
.pr .d{font-family:var(--mono);font-size:11px}
.pr .m{font-family:var(--mono);font-size:11px;margin-left:auto;color:var(--dim)}
.empty{padding:16px 18px;color:var(--dim2);font-size:11.5px;line-height:1.6}
.linkish{color:var(--accent);text-decoration:none;border-bottom:1px dotted currentColor;cursor:pointer}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:9px 4px;font-size:11px;color:var(--dim2);font-family:var(--mono);
  letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid transparent;margin-bottom:-1px}
.tabs button[aria-pressed=true]{color:var(--txt);border-bottom-color:var(--accent)}

@media (max-width:880px){
  #app{grid-template-columns:1fr;grid-template-rows:minmax(230px,42vh) auto 1fr}
  #rail{grid-row:3;border-right:none;border-top:1px solid var(--line)}
  #stage{grid-row:1}
  #ribbonWrap{grid-row:2}
  #ribbon{height:44px}
  .brand h1{font-size:24px}
  #legend{display:none}
  #hint{top:auto;bottom:10px;max-width:calc(100% - 24px);font-size:11px;padding:5px 12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <aside id="rail">
    <div class="brand">
      <h1>Umbra<em>.</em></h1>
      <p>Atlas calculé des éclipses solaires. Trajets d'ombre, circonstances locales et éléments de Bessel, générés dans le navigateur.</p>
    </div>

    <div class="sect">
      <p class="eyebrow">Fenêtre temporelle <b id="spanInfo"></b></p>
      <div class="yearRow">
        <input class="yearBox" id="y0" inputmode="numeric" aria-label="Année de début">
        <span>→</span>
        <input class="yearBox" id="y1" inputmode="numeric" aria-label="Année de fin">
        <span class="span" id="countInfo">—</span>
      </div>
      <div class="slider" id="slider">
        <div class="track"></div><div class="fill" id="sfill"></div>
        <div class="knob" id="k0" tabindex="0" role="slider" aria-label="Année de début"></div>
        <div class="knob" id="k1" tabindex="0" role="slider" aria-label="Année de fin"></div>
      </div>
      <div class="ticks" id="sticks"></div>
      <div class="presets" id="presets"></div>
    </div>

    <div class="sect">
      <p class="eyebrow">Affichage</p>
      <div class="filters" id="filters"></div>
      <div style="height:11px"></div>
      <div class="seg" id="colorSeg">
        <button data-c="type" aria-pressed="true">Couleur par type</button>
        <button data-c="date" aria-pressed="false">par date</button>
      </div>
    </div>

    <div class="tabs">
      <button data-tab="list" aria-pressed="true">Éclipses</button>
      <button data-tab="detail" aria-pressed="false">Fiche</button>
      <button data-tab="probe" aria-pressed="false">Lieu</button>
    </div>
    <div class="sect scroll" id="pane"></div>
  </aside>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="viewBtns">
      <button data-v="flat" aria-pressed="true">Planisphère</button>
      <button data-v="globe" aria-pressed="false">Globe</button>
    </div>
    <div id="zoomBtns">
      <button id="zin" title="Zoom avant">+</button>
      <button id="zout" title="Zoom arrière">–</button>
      <button id="zreset" title="Réinitialiser la vue">⌂</button>
    </div>
    <div id="legend"></div>
    <div class="hud" id="coords"></div>
    <div class="hud" id="scaleNote"></div>
    <div id="tip"></div>
    <div id="hint">Cliquez une bande pour ouvrir sa fiche, ailleurs pour sonder un lieu</div>
    <div id="player">
      <button id="play" aria-label="Lecture">▶</button>
      <div>
        <div class="lab">TU</div>
        <div class="clock" id="clock">—</div>
      </div>
      <input type="range" id="scrub" min="0" max="1000" value="500" aria-label="Instant de l'éclipse">
      <div style="min-width:96px">
        <div class="lab">SOUS L'OMBRE</div>
        <div class="clock" id="umbraInfo" style="font-size:11px">—</div>
      </div>
      <button class="miniBtn" id="closePlayer" aria-label="Fermer l'animation">✕</button>
    </div>
    <div id="progress"></div>
  </div>

  <div id="ribbonWrap"><canvas id="ribbon"></canvas></div>
</div>

/* ---------------- computation pipeline ---------------- */

}

}

  computing = true;

    const t0 = performance.now();

  const counts = { T: 0, A: 0, H: 0, P: 0 };
  allInRange.forEach(e => counts[e.type]++);
  document.querySelectorAll('.filt').forEach(el => {

/* ---------------- projection ---------------- */
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const cam = { zoom: 1, lon0: 0, lat0: 0, glon: 0, glat: 20, gzoom: 1 };

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const r = cv.parentElement.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const rb = $('#ribbon'), rr = rb.parentElement.getBoundingClientRect();
  rb.width = Math.round(rr.width * DPR); rb.height = Math.round(rr.height * DPR);
  rb.getContext('2d').setTransform(DPR, 0, 0, DPR, 0, 0);
  draw(); drawRibbon();
}
function kFlat() { return (W / 360) * cam.zoom; }
function globeR() { return Math.min(W, H) * 0.46 * cam.gzoom; }

function proj(lon, lat) {         // -> [x, y, visible]
  if (state.view === 'flat') {
    const k = kFlat();
    return [W / 2 + (lon - cam.lon0) * k, H / 2 - (lat - cam.lat0) * k, true];
  }
  const R = globeR(), p = lat * D2R, l = (lon - cam.glon) * D2R, p0 = cam.glat * D2R;

  const cosc = Math.sin(p0) * sp + Math.cos(p0) * cp * cl;

}

    const k = kFlat();

    lon = ((lon + 180) % 360 + 360) % 360 - 180;
    if (Math.abs(lat) > 90) return null;
    return [lon, lat];
  }
  const R = globeR(), x = px - W / 2, y = py - H / 2, rho = Math.hypot(x, y);
  if (rho > R) return null;
  const cc = Math.asin(Math.min(1, rho / R)), p0 = cam.glat * D2R;
  const lat = Math.asin(Math.cos(cc) * Math.sin(p0) + (rho ? (-y) * Math.sin(cc) * Math.cos(p0) / rho : 0)) / D2R;
  const lon = cam.glon + Math.atan2(x * Math.sin(cc), rho * Math.cos(cc) * Math.cos(p0) + y * Math.sin(cc) * Math.sin(p0)) / D2R;
  return [((lon + 180) % 360 + 360) % 360 - 180, lat];
}
function lonOffsets() {
  if (state.view !== 'flat') return [0];
  const k = kFlat(), half = (W / 2) / k;
  const lo = cam.lon0 - half, hi = cam.lon0 + half, out = [];

/* trace a polyline given as flat [lon,lat,...] or [[lon,lat],...] */
function tracePoly(pts, off, close) {

    }

/* ---------------- base map ---------------- */
function drawGraticule() {
  ctx.strokeStyle = '#111A2A'; ctx.lineWidth = 1; ctx.beginPath();
  const offs = lonOffsets();
  for (const off of offs) {
    for (let lon = -180; lon <= 180; lon += 30) {
      const seg = [];
      for (let lat = -90; lat <= 90; lat += 5) seg.push([lon, lat]);
      tracePoly(seg, off, false);
    }
    for (let lat = -60; lat <= 60; lat += 30) {
      const seg = [];
      for (let lon = -180; lon <= 180; lon += 5) seg.push([lon, lat]);
      tracePoly(seg, off, false);
    }
  }
  ctx.stroke();
  if (state.view === 'flat') return;
  ctx.strokeStyle = '#1C2942'; ctx.beginPath();
  const eq = []; for (let lon = -180; lon <= 180; lon += 4) eq.push([lon, 0]);

const STARS = (() => {
  let seed = 20260812, out = [];

  for (let i = 0; i < 260; i++) out.push([rnd(), rnd(), 0.3 + rnd() * 1.05, 0.12 + rnd() * 0.5]);

function drawStars() {
  for (const [fx, fy, r, a] of STARS) {

/* ---------------- eclipse rendering ---------------- */
function eclipseColor(e) {

  for (const e of order) {
    if (!e.path) continue;

    const isSel = state.sel === e;
    ctx.lineWidth = isSel ? 1.6 : 0.8;

/* ---------------- animation layer ---------------- */

    ctx.beginPath();

    for (const p of pts) { const [x, y] = proj(p[0], p[1]); st ? ctx.lineTo(x, y) : (ctx.moveTo(x, y), st = true); }

/* ---------------- probe marker ---------------- */

    ctx.moveTo(x + 6.5, y); ctx.lineTo(x + 10, y);

/* ---------------- ribbon ---------------- */
function drawRibbon() {
  const c = $('#ribbon'), g = c.getContext('2d');

  g.clearRect(0, 0, w, h);
  g.fillStyle = '#090E19'; g.fillRect(0, 0, w, h);

  const X = y => 14 + (y - y0) / sp * (w - 28);
  // gridlines

  g.font = '9px "IBM Plex Mono", monospace'; g.textAlign = 'center';

    <dt>Largeur de la bande</dt><dd>${path.width.toFixed(0)} km</dd>
    <dt>Hauteur du Soleil</dt><dd>${path.meta[gi].sunAlt.toFixed(0)}°</dd>
    <dt>Début du tracé (TU)</dt><dd>${fmtTime(path.jdStart - e.dT / 86400)}</dd>
    <dt>Fin du tracé (TU)</dt><dd>${fmtTime(path.jdEnd - e.dT / 86400)}</dd>`;
  } else if (e.gLat != null) {
    rows += `<dt>Maximum observé à</dt><dd>${fmtLat(e.gLat)} ${fmtLon(e.gLon)}</dd>`;
  }
  const c = calFromJd(e.jd);
  p.innerHTML = `
    <div class="dHead">
      <div class="kind" style="color:${T.color}">Éclipse ${T.label}${e.central === false && e.type !== 'P' ? ' (non centrale)' : ''}</div>
      <div class="date">${fmtDate(e.jd)}</div>
      <div class="sub">${c.greg ? 'calendrier grégorien' : 'calendrier julien'}${path ? ' · maximum au ' + fmtLat(pathCenterAt(e).lat) + ' ' + fmtLon(pathCenterAt(e).lon) : ''}</div>
    </div>
    <dl class="kv">${rows}</dl>
    ${path ? `<div style="padding:0 18px 14px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="chip" id="btnAnim">Animer l'ombre</button>
      <button class="chip" id="btnZoom">Cadrer le tracé</button>
      <button class="chip" id="btnGeo">Exporter GeoJSON</button></div>` : ''}
    <div class="note">Grandeur = fraction du diamètre solaire couverte. Gamma = distance minimale de l'axe d'ombre au centre de la Terre, en rayons terrestres.</div>`;
  if (path) {
    $('#btnAnim').onclick = () => startAnim(e);
    $('#btnZoom').onclick = () => frameEclipse(e);
    $('#btnGeo').onclick = () => exportGeoJSON(e);
  }
}
function pathCenterAt(e) {
  const p = e.path; let bi = 0, bd = 1e9;
  p.meta.forEach((m, i) => { const v = Math.abs(m.jd - e.jd); if (v < bd) { bd = v; bi = i; } });
  return { lat: p.center[bi][1], lon: p.center[bi][0] };
}
function renderProbe(p) {
  if (!state.probe) {
    p.innerHTML = `<div class="empty">Cliquez n'importe où sur la carte pour obtenir les circonstances locales de chaque éclipse de la période à cet endroit : type, grandeur, obscurcissement et durée.</div>`;
    return;
  }
  const pr = state.probe;
  const rows = pr.res.map((r, i) => `
    <div class="pr" data-i="${i}">
      <span class="d" style="color:${TYPES[r.e.type].color}">${fmtDate(r.e.jd, true)}</span>
      <span class="d" style="color:var(--dim2)">${fmtTime(r.jdut)}</span>
      <span class="m">${r.type === 'P' ? fmtObsc(r.obsc) + ' %'
        : '<b style="color:' + TYPES[r.type].color + '">' + (r.type === 'T' ? 'TOTALE ' : 'ANNUL. ')
          + fmtDur(r.dur).replace(' min ', "'").replace(' s', '"') + '</b>'}</span>
    </div>`).join('');
  const nT = pr.res.filter(r => r.type !== 'P').length;
  p.innerHTML = `
    <div class="probeHead">
      <div>
        <div class="eyebrow" style="margin:0">Point sondé</div>
        <div style="font-family:var(--mono);font-size:12px;margin-top:3px">${fmtLat(pr.lat)} · ${fmtLon(pr.lon)}</div>
      </div>
      <button class="close" id="pclose" aria-label="Effacer le point">✕</button>
    </div>
    <div class="note" style="padding:0 18px 10px">${pr.res.length} éclipse${pr.res.length > 1 ? 's' : ''} visible${pr.res.length > 1 ? 's' : ''} ici entre ${state.y0} et ${state.y1}, dont ${nT} centrale${nT > 1 ? 's' : ''}. Heure TU du maximum local, puis obscurcissement du disque solaire ou durée de la phase centrale.</div>
    ${rows || '<div class="empty">Aucune éclipse visible depuis ce point sur la période.</div>'}`;
  $('#pclose').onclick = () => { state.probe = null; renderPane(); draw(); };
  p.querySelectorAll('.pr').forEach(r => r.onclick = () => select(pr.res[+r.dataset.i].e, { frame: true, detail: true }));
}

/* ---------------- actions ---------------- */
function select(e, opt) {
  opt = opt || {};
  state.sel = e;
  if (state.anim && state.anim.e !== e) stopAnim();
  if (opt.frame && e.path) frameEclipse(e);
  if (opt.detail) setTab('detail'); else renderPane();
  draw(); drawRibbon();
}
function frameEclipse(e) {
  if (!e.path) return;
  let minLon = 999, maxLon = -999, minLat = 99, maxLat = -99, prev = null, unwrapped = [];
  for (const p of e.path.center) {
    let lon = p[0];
    if (prev !== null) { while (lon - prev > 180) lon -= 360; while (lon - prev < -180) lon += 360; }
    prev = lon; unwrapped.push(lon);
    minLon = Math.min(minLon, lon); maxLon = Math.max(maxLon, lon);
    minLat = Math.min(minLat, p[1]); maxLat = Math.max(maxLat, p[1]);
  }
  const cLon = (minLon + maxLon) / 2, cLat = (minLat + maxLat) / 2;
  if (state.view === 'flat') {
    cam.lon0 = ((cLon + 180) % 360 + 360) % 360 - 180; cam.lat0 = cLat;
    cam.zoom = Math.max(1, Math.min(8, 0.8 * Math.min(360 / Math.max(20, maxLon - minLon), (180 / Math.max(12, maxLat - minLat)) * (W / H) / 2)));
  } else { cam.glon = ((cLon + 180) % 360 + 360) % 360 - 180; cam.glat = cLat; }
  draw();
}
function startAnim(e) {
  const pad = 40 / 1440;
  state.anim = { e, t0: e.path.jdStart - pad, t1: e.path.jdEnd + pad, jd: e.jd, playing: true };
  $('#player').classList.add('on'); $('#play').textContent = '❚❚';
  tickAnim(true);
  requestAnimationFrame(loopAnim);
}
function stopAnim() { state.anim = null; $('#player').classList.remove('on'); draw(); }
let lastT = 0;
function loopAnim(ts) {
  const A = state.anim; if (!A) return;
  if (A.playing) {
    const dt = Math.min(60, ts - lastT); lastT = ts;
    A.jd += (A.t1 - A.t0) * dt / 9000;
    if (A.jd > A.t1) A.jd = A.t0;
    tickAnim();
  }
  requestAnimationFrame(loopAnim);
}
function tickAnim(setSlider) {
  const A = state.anim; if (!A) return;
  const f = (A.jd - A.t0) / (A.t1 - A.t0);
  if (setSlider || A.playing) $('#scrub').value = Math.round(f * 1000);
  const dT = deltaT(yearOf(A.jd)) / 86400;
  $('#clock').textContent = fmtTime(A.jd - dT);
  const e = A.e;
  let info = 'ombre hors du globe';
  if (A.jd >= e.path.jdStart && A.jd <= e.path.jdEnd) {
    let bi = 0, bd = 1e9;
    e.path.meta.forEach((m, i) => { const v = Math.abs(m.jd - A.jd); if (v < bd) { bd = v; bi = i; } });
    const m = e.path.meta[bi], c = e.path.center[bi];
    info = `${fmtDur(m.dur).replace(' min ', "'").replace(' s', '"')} · ${m.w.toFixed(0)} km`;
  }
  $('#umbraInfo').textContent = info;
  draw();
}
function exportGeoJSON(e) {
  const fc = {
    type: 'FeatureCollection',
    properties: { source: 'Umbra', date: fmtDate(e.jd), type: TYPES[e.type].label },
    features: [
      { type: 'Feature', properties: { name: 'ligne centrale' }, geometry: { type: 'LineString', coordinates: e.path.center } },
      { type: 'Feature', properties: { name: 'limite 1' }, geometry: { type: 'LineString', coordinates: e.path.limA } },
      { type: 'Feature', properties: { name: 'limite 2' }, geometry: { type: 'LineString', coordinates: e.path.limB } }
    ]
  };
  const blob = new Blob([JSON.stringify(fc)], { type: 'application/geo+json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const c = calFromJd(e.jd);
  a.download = `eclipse_${c.y}-${String(c.m).padStart(2, '0')}-${String(Math.floor(c.d)).padStart(2, '0')}.geojson`;
  a.click(); URL.revokeObjectURL(a.href);
}
function probeAt(lon, lat) {
  const res = [];
  for (const e of allInRange) {
    const c = localCircumstances(e, lat, lon);
    if (c) { c.e = e; res.push(c); }
  }
  state.probe = { lat, lon, res };
  setTab('probe'); draw();
}

/* ---------------- interactions ---------------- */
let drag = null;
function hideHint() { const h = $('#hint'); if (h && !h.classList.contains('gone')) h.classList.add('gone'); }
setTimeout(hideHint, 14000);
cv.addEventListener('pointerdown', ev => {
  hideHint(); $('#tip').style.display = 'none';
  cv.setPointerCapture(ev.pointerId);
  drag = { x: ev.clientX, y: ev.clientY, moved: 0, sx: ev.clientX, sy: ev.clientY };
});
cv.addEventListener('pointermove', ev => {
  const r = cv.getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top;
  if (drag) {
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    if (state.view === 'flat') {
      const k = kFlat(); cam.lon0 -= dx / k; cam.lat0 += dy / k;
      cam.lat0 = Math.max(-88, Math.min(88, cam.lat0));
      cam.lon0 = ((cam.lon0 + 180) % 360 + 360) % 360 - 180;
    } else {
      const s = 0.35 / cam.gzoom;
      cam.glon -= dx * s; cam.glat = Math.max(-89, Math.min(89, cam.glat + dy * s));
      cam.glon = ((cam.glon + 180) % 360 + 360) % 360 - 180;
    }
    drag.x = ev.clientX; drag.y = ev.clientY; draw(); return;
  }
  const ll = unproj(px, py);
  $('#coords').textContent = ll ? `${fmtLat(ll[1])}  ${fmtLon(ll[0])}` : '';
  hoverTest(ll, px, py);
});
function nearestPath(ll) {
  let best = null, bd = 1e9;
  for (const e of visible) {
    if (!e.path) continue;
    for (let i = 0; i < e.path.center.length; i += 2) {
      const p = e.path.center[i];
      let dl = Math.abs(p[0] - ll[0]); if (dl > 180) dl = 360 - dl;
      const d = Math.hypot(dl * Math.cos(ll[1] * D2R), p[1] - ll[1]);
      if (d < bd) { bd = d; best = e; }
    }
  }
  const tol = state.view === 'flat' ? 12 / kFlat() : 900 / globeR();
  return bd < tol ? best : null;
}
function hoverTest(ll, px, py) {
  const tip = $('#tip');
  if (!ll) { tip.style.display = 'none'; state.hover = null; return; }
  const best = nearestPath(ll);
  if (best) {
    tip.style.display = 'block';
    tip.innerHTML = `<b style="color:${eclipseColor(best)}">${TYPES[best.type].label}</b><br>
      <span class="t">${fmtDate(best.jd)}</span><br>
      <span class="t">${fmtDur(best.dur)} · ${best.width.toFixed(0)} km</span>`;
    tip.style.left = Math.min(W - 240, px + 14) + 'px';
    tip.style.top = Math.max(4, py - 50) + 'px';
    state.hover = best;
  } else { tip.style.display = 'none'; state.hover = null; }
}
cv.addEventListener('pointerup', ev => {
  const wasDrag = drag && drag.moved > 6;
  drag = null;
  if (wasDrag) return;
  const r = cv.getBoundingClientRect();
  const ll = unproj(ev.clientX - r.left, ev.clientY - r.top);
  if (!ll) return;
  const hit = nearestPath(ll);
  if (hit) select(hit, { detail: true });
  else probeAt(ll[0], ll[1]);
});
cv.addEventListener('pointerleave', () => { $('#tip').style.display = 'none'; $('#coords').textContent = ''; });
cv.addEventListener('wheel', ev => {
  ev.preventDefault();
  const f = Math.exp(-ev.deltaY * 0.0016);
  if (state.view === 'flat') {
    const r = cv.getBoundingClientRect();
    const before = unproj(ev.clientX - r.left, ev.clientY - r.top);
    cam.zoom = Math.max(0.7, Math.min(60, cam.zoom * f));
    const after = unproj(ev.clientX - r.left, ev.clientY - r.top);
    if (before && after) {
      cam.lon0 += before[0] - after[0]; cam.lat0 += before[1] - after[1];
      cam.lat0 = Math.max(-88, Math.min(88, cam.lat0));
    }
  } else cam.gzoom = Math.max(0.75, Math.min(14, cam.gzoom * f));
  draw();
}, { passive: false });

$('#zin').onclick = () => { if (state.view === 'flat') cam.zoom = Math.min(60, cam.zoom * 1.5); else cam.gzoom = Math.min(14, cam.gzoom * 1.4); draw(); };
$('#zout').onclick = () => { if (state.view === 'flat') cam.zoom = Math.max(0.7, cam.zoom / 1.5); else cam.gzoom = Math.max(0.75, cam.gzoom / 1.4); draw(); };
$('#zreset').onclick = () => { cam.zoom = 1; cam.lon0 = 0; cam.lat0 = 0; cam.gzoom = 1; draw(); };
document.querySelectorAll('#viewBtns button').forEach(b => b.onclick = () => {
  if (state.view === b.dataset.v) return;
  state.view = b.dataset.v;
  document.querySelectorAll('#viewBtns button').forEach(x => x.setAttribute('aria-pressed', x === b));
  if (state.sel && state.sel.path) frameEclipse(state.sel);
  else if (state.probe) { cam.glon = state.probe.lon; cam.glat = state.probe.lat; }
  draw();
});
$('#play').onclick = () => {
  const A = state.anim; if (!A) return;
  A.playing = !A.playing; lastT = performance.now();
  $('#play').textContent = A.playing ? '❚❚' : '▶';
};
$('#scrub').oninput = ev => {
  const A = state.anim; if (!A) return;
  A.playing = false; $('#play').textContent = '▶';
  A.jd = A.t0 + (A.t1 - A.t0) * (+ev.target.value / 1000);
  tickAnim();
};
$('#closePlayer').onclick = stopAnim;

/* ribbon interaction */
$('#ribbon').addEventListener('click', ev => {
  const r = ev.currentTarget.getBoundingClientRect();
  const w = r.width, x = ev.clientX - r.left;
  const y = state.y0 + (x - 14) / (w - 28) * (state.y1 + 1 - state.y0);
  let best = null, bd = 1e9;
  for (const e of visible) { const d = Math.abs(e.year + 0.5 - y); if (d < bd) { bd = d; best = e; } }
  if (best) select(best, { frame: true, detail: true });
});

/* ---------------- controls ---------------- */
function setTab(t) {
  state.tab = t;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === t));
  renderPane();
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
document.querySelectorAll('#colorSeg button').forEach(b => b.onclick = () => {
  state.color = b.dataset.c;
  document.querySelectorAll('#colorSeg button').forEach(x => x.setAttribute('aria-pressed', x === b));
  draw(); drawRibbon(); renderPane(); buildLegend();
});
function buildFilters() {
  $('#filters').innerHTML = Object.entries(TYPES).map(([k, v]) => `
    <label class="filt ${state.filters[k] ? 'on' : ''}" data-t="${k}" style="color:${state.filters[k] ? '' : ''}">
      <input type="checkbox" ${state.filters[k] ? 'checked' : ''} style="color:${v.color}">
      <span class="sw" style="background:${v.color}"></span>${v.label}<b>0</b>
    </label>`).join('');
  $('#filters').querySelectorAll('.filt').forEach(l => {
    l.querySelector('input').onchange = ev => {
      state.filters[l.dataset.t] = ev.target.checked;
      l.classList.toggle('on', ev.target.checked);
      collect(); draw(); renderPane();
    };
  });
}
function buildLegend() {
  if (state.color === 'type') {
    $('#legend').innerHTML = Object.entries(TYPES).map(([k, v]) =>
      `<div><i style="background:${v.color}"></i>${v.label}</div>`).join('');
  } else {
    $('#legend').innerHTML = `<div style="gap:6px">
      <span>${state.y0}</span>
      <i style="width:96px;height:7px;border-radius:3px;background:linear-gradient(90deg,hsl(260,72%,58%),hsl(195,72%,58%),hsl(130,72%,58%),hsl(60,72%,58%),hsl(0,72%,58%))"></i>
      <span>${state.y1}</span></div>`;
  }
}
/* dual slider */
const slider = $('#slider');
/* the ruler is deliberately non-linear: it dilates the years around the present */
const BP = [[-1999, 0], [1000, .09], [1600, .17], [1800, .24], [1900, .32], [2000, .44],
[2050, .58], [2100, .70], [2200, .80], [2500, .91], [3000, 1]];
function sx(y) {
  if (y <= BP[0][0]) return 0;
  for (let i = 1; i < BP.length; i++) {
    if (y <= BP[i][0]) {
      const [a, fa] = BP[i - 1], [b, fb] = BP[i];
      return fa + (y - a) / (b - a) * (fb - fa);
    }
  }
  return 1;
}
function sxInv(f) {
  f = Math.max(0, Math.min(1, f));
  for (let i = 1; i < BP.length; i++) {
    if (f <= BP[i][1]) {
      const [a, fa] = BP[i - 1], [b, fb] = BP[i];
      return Math.round(a + (f - fa) / (fb - fa) * (b - a));
    }
  }
  return BP[BP.length - 1][0];
}
function syncSlider() {
  const w = slider.clientWidth;
  const a = Math.max(0, Math.min(1, sx(state.y0))), b = Math.max(0, Math.min(1, sx(state.y1)));
  $('#k0').style.left = a * w + 'px'; $('#k1').style.left = b * w + 'px';
  $('#sfill').style.left = a * w + 'px'; $('#sfill').style.width = (b - a) * w + 'px';
  $('#y0').value = state.y0; $('#y1').value = state.y1;
  $('#spanInfo').textContent = (state.y1 - state.y0 + 1) + ' ans';
  buildLegend();
}
function knobDrag(el, which) {
  const move = ev => {
    const r = slider.getBoundingClientRect();
    const f = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
    let y = sxInv(f);
    if (which === 0) state.y0 = Math.min(y, state.y1 - 1); else state.y1 = Math.max(y, state.y0 + 1);
    clampSpan(which);
    syncSlider(); scheduleRange();
  };
  el.addEventListener('pointerdown', ev => {
    el.setPointerCapture(ev.pointerId);
    const up = () => { el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); };
    el.addEventListener('pointermove', move); el.addEventListener('pointerup', up);
    move(ev);
  });
  el.addEventListener('keydown', ev => {
    const d = ev.key === 'ArrowLeft' ? -1 : ev.key === 'ArrowRight' ? 1 : ev.key === 'PageUp' ? 10 : ev.key === 'PageDown' ? -10 : 0;
    if (!d) return; ev.preventDefault();
    if (which === 0) state.y0 = Math.min(state.y1 - 1, state.y0 + d); else state.y1 = Math.max(state.y0 + 1, state.y1 + d);
    clampSpan(which); syncSlider(); scheduleRange();
  });
}
function clampSpan(which) {
  state.y0 = Math.max(HARD[0], state.y0); state.y1 = Math.min(HARD[1], state.y1);
  if (state.y1 - state.y0 > MAXSPAN) {
    if (which === 0) state.y1 = state.y0 + MAXSPAN; else state.y0 = state.y1 - MAXSPAN;
  }
}
knobDrag($('#k0'), 0); knobDrag($('#k1'), 1);
let rangeTimer = null;
function scheduleRange() {
  clearTimeout(rangeTimer);
  rangeTimer = setTimeout(() => { requestRange(); renderPane(); }, 260);
}
[['#y0', 0], ['#y1', 1]].forEach(([sel, w]) => {
  $(sel).addEventListener('change', ev => {
    const v = parseInt(ev.target.value, 10);
    if (isNaN(v)) { syncSlider(); return; }
    if (w === 0) state.y0 = Math.min(v, state.y1 - 1); else state.y1 = Math.max(v, state.y0 + 1);
    clampSpan(w); syncSlider(); requestRange(); renderPane();
  });
});
const PRESETS = [
  ['Prochaines décennies', 2026, 2050],
  ['XXIe siècle', 2001, 2100],
  ['1900 – 2000', 1900, 2000],
  ['Une vie (80 ans)', 1985, 2065],
  ['Antiquité', -600, -500]
];
$('#presets').innerHTML = PRESETS.map((p, i) => `<button class="chip" data-i="${i}">${p[0]}</button>`).join('');
$('#presets').querySelectorAll('button').forEach(b => b.onclick = () => {
  const p = PRESETS[+b.dataset.i];
  state.y0 = p[1]; state.y1 = p[2]; syncSlider(); requestRange(); renderPane();
});
$('#sticks').innerHTML = [-1999, 1800, 2000, 2200, 3000]
  .map(y => `<span style="left:${(sx(y) * 100).toFixed(2)}%">${y < 0 ? '\u22122000' : y}</span>`).join('');

/* ---------------- boot ---------------- */
window.addEventListener('resize', () => { resize(); syncSlider(); });
buildFilters(); syncSlider(); resize(); requestRange(); setTab('list');

</script>
</body>
